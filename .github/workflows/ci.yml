name: Repository validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-and-config:
    name: Python tests and configuration validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-common.txt
            requirements-playwright.txt
            requirements-dev.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Validate workflow inputs and source boundaries
        run: python tests/validate_workflow.py

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Validate repository configuration files
        run: python scripts/validate_repo_files.py

  flow-linux-ui:
    name: Flow Linux GTK smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install GTK3 and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 xvfb xauth
      - name: Exercise GTK launch and search
        run: |
          xvfb-run -a /usr/bin/python3 flow-desktop/app.py --smoke-test
          xvfb-run -a /usr/bin/python3 flow-desktop/smoke_check.py
          /usr/bin/python3 flow-desktop/doctor.py --json

  github-actions-lint:
    name: GitHub Actions workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint workflows and expressions with version-pinned actionlint
        shell: bash
        run: |
          set +e
          npm exec --yes --package=@kjanat/actionlint@1.17.1 -- actionlint -color .github/workflows/*.yml > "$RUNNER_TEMP/actionlint.log" 2>&1
          lint_status=$?
          cat "$RUNNER_TEMP/actionlint.log"
          if [ "$lint_status" -ne 0 ]; then
            {
              echo '### actionlint diagnostics'
              echo '```text'
              cat "$RUNNER_TEMP/actionlint.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              echo "::error title=actionlint::$line"
            done < "$RUNNER_TEMP/actionlint.log"
          fi
          exit "$lint_status"

  powershell-syntax:
    name: PowerShell syntax validation
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Parse PowerShell scripts and tests
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem -Path scripts -Filter '*.ps1' -File -Recurse
            Get-ChildItem -Path scripts -Filter '*.psm1' -File -Recurse
            Get-ChildItem -Path tests -Filter '*.ps1' -File -Recurse
          )
          $parseFailures = @()

          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null

            foreach ($parseError in $parseErrors) {
              $parseFailures += "$($file.Name): $($parseError.Message) at line $($parseError.Extent.StartLineNumber)"
            }
          }

          if ($parseFailures.Count -gt 0) {
            $parseFailures | ForEach-Object { Write-Host ("::error::{0}" -f $_) }
            throw "PowerShell syntax validation failed for $($parseFailures.Count) error(s)."
          }

          Write-Output "Parsed $($files.Count) PowerShell file(s) without syntax errors."

      - name: Run the PowerShell Pester suite
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1
          Invoke-Pester -Path tests -Output Detailed -CI
