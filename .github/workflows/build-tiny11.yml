# GitHub Actions Workflow for building Tiny11 ISO
# Maintainer: NggKhaiz | automation credit: kelexine | original builder: ntdevlabs
# Description: Fully automated Windows 11 ISO processing with tiny11builder
# Fork maintainer: NggKhaiz | original builder: ntdevlabs | automation: kelexine

name: Build Tiny11 Standard (SafeLite)
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Standard • Microsoft • {0} • {1}', inputs.windows_version, inputs.image_edition) || 'Standard • config update' }}

on:
  push:
    paths:
      - 'config/build_config.json'
  workflow_dispatch:
    inputs:
      windows_version:
        description: 'Actual Windows version for the artifact label (e.g., 25H2); this does not select the edition'
        required: true
      expected_iso_path:
        description: 'Query-free path from release detection; leave blank for a manual build of the current Microsoft ISO'
        required: false
        default: ''
      windows_build:
        description: 'Fallback Windows build number (e.g. 26200.8655) — only used if it cannot be read directly from the ISO'
        required: false
        default: ''
      image_index:
        description: 'Source image index; enter 0 to auto-select image_edition by its actual image name'
        required: false
        default: '0'
        type: string
      image_edition:
        description: 'Edition to auto-select when image_index is 0 (defaults to Pro)'
        required: true
        default: 'Pro'
        type: choice
        options:
          - 'Home'
          - 'Pro'
          - 'Education'
          - 'Enterprise'
      language:
        description: 'Source ISO language (the Microsoft link resolver currently supports English US)'
        required: false
        default: 'English'
        type: choice
        options:
          - 'English'
      skip_cleanup:
        description: 'Skip cleanup (for debugging)'
        required: false
        default: false
        type: boolean
      account_setup:
        description: 'Default classic: create your own offline local account in OOBE. auto-admin is an unsafe opt-in: blank-password Admin and one auto-logon; disposable isolated VMs only.'
        type: choice
        required: false
        default: 'classic'
        options:
          - 'auto-admin'
          - 'classic'

env:
  ARIA2C_CONNECTIONS: '16'
  ARIA2C_SPLIT: '16'
  POWERSHELL_TELEMETRY_OPTOUT: '1'

permissions:
  contents: read

jobs:
  check-custom-config:
    name: Check custom ISO configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_custom_iso: ${{ steps.check.outputs.has_custom_iso }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Check whether a custom URL is configured
        id: check
        run: python3 scripts/check_custom_iso_config.py

  build-tiny11:
    needs: check-custom-config
    if: github.event_name == 'workflow_dispatch' || needs.check-custom-config.outputs.has_custom_iso == 'true'
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      WINDOWS_VERSION: ${{ inputs.windows_version }}
      WINDOWS_BUILD_FALLBACK: ${{ inputs.windows_build }}
      REQUESTED_IMAGE_INDEX: ${{ inputs.image_index }}
      REQUESTED_EDITION: ${{ inputs.image_edition }}
      BUILD_LANGUAGE_INPUT: ${{ inputs.language }}
      SKIP_CLEANUP: ${{ inputs.skip_cleanup }}
      EXPECTED_ISO_PATH: ${{ inputs.expected_iso_path }}
      ACCOUNT_SETUP: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.account_setup || 'classic' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install common Python dependencies
        run: python -m pip install -r requirements-common.txt

      - name: Install Playwright for Microsoft link resolution
        if: github.event_name == 'workflow_dispatch'
        run: python -m pip install -r requirements-playwright.txt

      - name: Resolve custom ISO from JSON
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          python scripts/prepare_custom_iso_download.py --config config/build_config.json
          if ($LASTEXITCODE -ne 0) { throw "Could not prepare the custom direct ISO from config/build_config.json." }

      - name: Validate build inputs
        shell: pwsh
        run: |
          if ($env:WINDOWS_VERSION -notmatch '^(?:\d{2}H\d|Insider-[A-Za-z0-9-]+|Latest|Unknown|Custom)$') {
            throw "Windows version must be a safe release label such as 25H2, Insider-26H2, or Custom."
          }
          $sourceIndex = 0
          if (-not [int]::TryParse($env:REQUESTED_IMAGE_INDEX, [ref]$sourceIndex) -or $sourceIndex -lt 0) {
            throw "image_index must be a non-negative integer; use 0 for edition-name selection."
          }
          if ($env:REQUESTED_EDITION -notin @('Home', 'Pro', 'Education', 'Enterprise')) {
            throw "Unsupported image_edition input."
          }
          if ($env:BUILD_LANGUAGE_INPUT -ne 'English') {
            throw "The CI ISO workflows currently support English (United States) media only."
          }
          if ($env:WINDOWS_BUILD_FALLBACK -and $env:WINDOWS_BUILD_FALLBACK -notmatch '^(?:\d{5}(?:\.\d+)?|Latest|Unknown)$') {
            throw "windows_build must be a numeric Windows build label, Latest, Unknown, or blank."
          }
          if ($env:SKIP_CLEANUP -notin @('true', 'false')) {
            throw "skip_cleanup must be true or false."
          }

      - name: Record build start time
        shell: pwsh
        run: |
          $startUnix = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          Add-Content -Path $env:GITHUB_ENV -Value "BUILD_START_UNIX=$startUnix"

      - name: Generate folder name and build parameters
        shell: pwsh
        run: |
          # ISO filename/tag are finalized later in "Verify tiny11 ISO creation"
          $date = Get-Date -Format 'yyyy-MM-dd'
          $version = "$env:WINDOWS_VERSION"

          $edition = "$env:REQUESTED_EDITION"

          $language = "$env:BUILD_LANGUAGE_INPUT" -replace '[^a-zA-Z]', ''

          # New structure: Tiny11-EDITION-VERSION for folders (unchanged)
          $folderName = "Tiny11-$edition-$version"

          Write-Output "Generated folder name: $folderName"

          Add-Content -Path $env:GITHUB_ENV -Value "FOLDER_NAME=$folderName"
          Add-Content -Path $env:GITHUB_ENV -Value "EDITION_NAME=$edition"
          Add-Content -Path $env:GITHUB_ENV -Value "BUILD_DATE=$date"
          Add-Content -Path $env:GITHUB_ENV -Value "BUILD_LANGUAGE=$language"


      - name: Install Playwright Chromium
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw "Failed to install the Chromium browser required for Microsoft link resolution." }

      - name: Resolve Microsoft ISO download link
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          python scripts/prepare_microsoft_iso_download.py `
            --version "$env:WINDOWS_VERSION" `
            --expected-iso-path "$env:EXPECTED_ISO_PATH" `
            --language "$env:BUILD_LANGUAGE_INPUT"
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve and verify a fresh Microsoft ISO link." }

      - name: Add build plan to run summary
        shell: pwsh
        run: |
          $sourceLabel = switch ($env:ISO_SOURCE_MODE) {
            'custom' { 'Custom direct ISO from repository configuration (URL withheld)' }
            'microsoft' { 'Microsoft direct-download resolver' }
            default { throw "Unknown ISO source mode; the source resolver did not complete." }
          }
          $imageSelection = if ([int]$env:REQUESTED_IMAGE_INDEX -eq 0) {
            "Select '$env:REQUESTED_EDITION' by actual image name"
          } else {
            "Use explicit source index $env:REQUESTED_IMAGE_INDEX"
          }
          $cleanupPlan = if ($env:SKIP_CLEANUP -eq 'true') { 'Skipped (debug mode)' } else { 'Normal cleanup' }
          $accountSetupPlan = if ([string]::IsNullOrWhiteSpace($env:ACCOUNT_SETUP)) { 'classic' } else { $env:ACCOUNT_SETUP }
          $plan = @"
          # 🛠️ Standard / SafeLite build plan

          | Setting | Planned value |
          | --- | --- |
          | ISO source | $sourceLabel |
          | Windows label | $env:WINDOWS_VERSION |
          | Edition | $env:REQUESTED_EDITION |
          | Image selection | $imageSelection |
          | Language | $env:BUILD_LANGUAGE_INPUT |
          | Account setup | $accountSetupPlan |
          | Cleanup | $cleanupPlan |

          The download URL is intentionally omitted from this summary. Custom-source URLs are stored in the tracked configuration file and may also remain in Git history.
          "@
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $plan

      - name: Discord - Build Started
        continue-on-error: true
        run: |
          python scripts/discord_notify.py `
            --webhook "$env:DISCORD_WEBHOOK" `
            --type build-started `
            --data (ConvertTo-Json @{
              version = "$env:WINDOWS_VERSION"
              build_type = "Standard"
              edition = "$env:EDITION_NAME"
              account_setup = "$env:ACCOUNT_SETUP"
            } -Compress)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_BUILDS }}
        shell: pwsh
        
      - name: System information
        shell: pwsh
        run: |
          Write-Output "=== System Information ==="
          Write-Output "OS: $(Get-CimInstance Win32_OperatingSystem | Select-Object -ExpandProperty Caption)"
          Write-Output "PowerShell: $($PSVersionTable.PSVersion)"
          Write-Output "Architecture: $env:PROCESSOR_ARCHITECTURE"
          
          $disk = Get-PSDrive C
          $freeGB = [math]::Round($disk.Free / 1GB, 2)
          $totalGB = [math]::Round($disk.Used / 1GB + $disk.Free / 1GB, 2)
          Write-Output "Disk C: ${freeGB}GB free / ${totalGB}GB total"
          
          if ($freeGB -lt 25) {
            Write-Error "Insufficient disk space. At least 25GB required, found ${freeGB}GB"
            exit 1
          }
          
      - name: Install aria2c
        shell: pwsh
        run: |
          Write-Output "Installing aria2c for faster downloads..."
          choco install aria2 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey failed to install aria2 (exit $LASTEXITCODE)." }
          aria2c --version
          if ($LASTEXITCODE -ne 0) { throw "aria2c is unavailable after installation." }
          
      - name: Download Windows 11 ISO
        shell: pwsh
        run: |
          $url = $env:WINDOWS_ISO_URL
          if ([string]::IsNullOrWhiteSpace($url)) {
            throw "No runner-local direct ISO URL was prepared. The resolution step must complete first."
          }
          try {
            $uri = [Uri]$url
          } catch {
            throw "The resolved ISO URL is not a valid absolute URL."
          }
          $sourceMode = $env:ISO_SOURCE_MODE
          $sourceHost = [regex]::Replace([string]$env:ISO_SOURCE_HOST, '^\[|\]$', '').TrimEnd('.').ToLowerInvariant()
          $uriHost = [regex]::Replace($uri.DnsSafeHost, '^\[|\]$', '').TrimEnd('.').ToLowerInvariant()
          $sourcePort = 0
          $approvedMicrosoftHosts = @('software.download.prss.microsoft.com', 'download.microsoft.com')
          if ($sourceMode -notin @('microsoft', 'custom') -or [string]::IsNullOrWhiteSpace($sourceHost) -or -not [int]::TryParse($env:ISO_SOURCE_PORT, [ref]$sourcePort)) {
            throw "The ISO source was not resolved by an approved workflow step."
          }
          if ($uri.Scheme -ne 'https' -or $uriHost -ne $sourceHost -or -not [string]::IsNullOrEmpty($uri.UserInfo) -or $uri.Port -ne $sourcePort -or -not [string]::IsNullOrEmpty($uri.Fragment) -or -not $uri.AbsolutePath.EndsWith('.iso', [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "The ISO URL does not match the validated HTTPS direct-download source."
          }
          if ($sourceMode -eq 'microsoft' -and ($uriHost -notin $approvedMicrosoftHosts -or $sourcePort -ne 443)) {
            throw "Microsoft mode accepts only approved Microsoft download hosts on port 443."
          }
          $output = "Win11_Source.iso"

          Write-Output "Downloading $sourceMode ISO from host $($uri.Host); full URL is masked."

          $startTime = Get-Date

          aria2c `
            --quiet=true `
            --console-log-level=warn `
            --summary-interval=30 `
            --max-connection-per-server=${{ env.ARIA2C_CONNECTIONS }} `
            --split=${{ env.ARIA2C_SPLIT }} `
            --min-split-size=5M `
            --max-tries=5 `
            --retry-wait=3 `
            --timeout=60 `
            --connect-timeout=30 `
            --continue=true `
            --allow-overwrite=true `
            --auto-file-renaming=false `
            --file-allocation=none `
            --check-integrity=true `
            --out=$output `
            "$url"
          if ($LASTEXITCODE -ne 0) {
            throw "aria2c failed with exit code $LASTEXITCODE"
          }

          $downloadTime = (Get-Date) - $startTime

          if (-not (Test-Path $output)) {
            Write-Error "Download failed - ISO file not found"
            exit 1
          }

          $sizeGB = [math]::Round((Get-Item $output).Length / 1GB, 2)
          Write-Output "Download complete: ${sizeGB}GB in $($downloadTime.TotalMinutes.ToString('F2')) minutes"

      - name: Clear source URL from runner environment
        if: always()
        shell: pwsh
        run: |
          Remove-Item Env:\WINDOWS_ISO_URL -ErrorAction SilentlyContinue
          Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_ISO_URL="

      - name: Mount Windows ISO
        shell: pwsh
        run: |
          $isoPath = Join-Path $PWD "Win11_Source.iso"
          Write-Output "Mounting ISO: $isoPath"
          
          $mount = Mount-DiskImage -ImagePath $isoPath -PassThru -StorageType ISO
          Start-Sleep -Seconds 3
          
          $driveLetter = ($mount | Get-Volume).DriveLetter
          
          if (-not $driveLetter) {
            Write-Error "Failed to mount ISO or retrieve drive letter"
            exit 1
          }
          
          Write-Output "ISO mounted successfully at drive: ${driveLetter}:"
          
          # Verify critical files exist
          $requiredFiles = @(
            "${driveLetter}:\sources\boot.wim",
            "${driveLetter}:\sources\install.wim",
            "${driveLetter}:\sources\install.esd"
          )
          
          $foundFiles = $requiredFiles | Where-Object { Test-Path $_ }
          
          if ($foundFiles.Count -eq 0) {
            Write-Error "No install.wim or install.esd found on mounted ISO"
            exit 1
          }
          
          Write-Output "Found: $($foundFiles -join ', ')"
          
          # Persist drive letter for next steps
          Add-Content -Path $env:GITHUB_ENV -Value "ISO_DRIVE=$driveLetter"
          
      - name: Prepare autounattend.xml
        shell: pwsh
        run: |
          if (Test-Path "autounattend.xml") {
            Write-Output "Found local autounattend.xml"
            Copy-Item "autounattend.xml" "scripts\autounattend.xml" -Force
            Write-Output "Copied to scripts directory"
          } else {
            Write-Warning "autounattend.xml not found in root!"
          }
          
      - name: Verify headless script
        shell: pwsh
        run: |
          $scriptPath = ".\scripts\tiny11maker-headless.ps1"
          
          if (-not (Test-Path $scriptPath)) {
            Write-Error "Headless script not found at $scriptPath"
            Write-Output "Available files:"
            Get-ChildItem -Path . -Recurse -Filter "*.ps1" | ForEach-Object { Write-Output $_.FullName }
            exit 1
          }
          
          Write-Output "Headless script found: $scriptPath"
          
      - name: Run tiny11maker (headless mode)
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          
          $params = @{
            ISO = $env:ISO_DRIVE
            INDEX = [int]"$env:REQUESTED_IMAGE_INDEX"
            Edition = "$env:REQUESTED_EDITION"
          }
          
          if ("$env:SKIP_CLEANUP" -eq "true") {
            $params.SkipCleanup = $true
            Write-Output "Cleanup will be skipped (debugging mode)"
          }

          # Only fall back to the default when nothing was supplied, so the
          # builder's ValidateSet never receives an empty string.
          $accountSetup = "$env:ACCOUNT_SETUP"
          if ([string]::IsNullOrWhiteSpace($accountSetup)) { $accountSetup = 'classic' }
          Write-Output "Account setup: $accountSetup"
          
          Write-Output "=== Starting Tiny11 Builder ==="
          Write-Output "ISO Drive: $($params.ISO)"
          Write-Output "Image Index: $($params.INDEX)"
          Write-Output "Account setup: $accountSetup"
          Write-Output "Timestamp: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
          
          $startTime = Get-Date
          
          .\scripts\tiny11maker-headless.ps1 @params -AccountSetup $accountSetup
          
          $buildTime = (Get-Date) - $startTime
          Write-Output "Build completed in $($buildTime.TotalMinutes.ToString('F2')) minutes"
          
      - name: Verify tiny11 ISO creation
        id: build_metadata
        shell: pwsh
        run: |
          $tempIso = ".\scripts\tiny11.iso"

          # Check if ISO was created
          if (-not (Test-Path $tempIso)) {
            Write-Error "$tempIso was not created!"
            Write-Output "Contents of current directory:"
            Get-ChildItem -Path . | Format-Table Name, Length, LastWriteTime
            exit 1
          }

          # Build metadata records the actual ISO image selected by the builder.
          $buildInfoPath = "scripts\tiny11-buildinfo.json"
          if (-not (Test-Path $buildInfoPath)) {
            throw "Build metadata $buildInfoPath is missing; refusing to label the ISO using only workflow inputs."
          }
          try {
            $buildInfo = Get-Content -Path $buildInfoPath -Raw | ConvertFrom-Json
          } catch {
            throw "Could not parse build metadata $buildInfoPath : $_"
          }

          $buildNumber = [string]$buildInfo.windows_build
          $sourceImageIndex = [string]$buildInfo.source_index
          $sourceImageName = (([string]$buildInfo.image_name).Trim() -replace '[\r\n]+', ' ')
          $finalImageIndex = [string]$buildInfo.final_image_index
          $actualEdition = (([string]$buildInfo.edition).Trim() -replace '[\r\n]+', ' ')
          $edition = $actualEdition -replace '[^A-Za-z0-9-]', ''

          if ([string]::IsNullOrWhiteSpace($sourceImageIndex) -or [string]::IsNullOrWhiteSpace($sourceImageName) -or [string]::IsNullOrWhiteSpace($finalImageIndex) -or [string]::IsNullOrWhiteSpace($edition)) {
            throw "Build metadata does not contain the actual selected source image, edition, or final image index."
          }

          Write-Output "Actual source image: index $sourceImageIndex - $sourceImageName"
          Write-Output "Final install.wim image index: $finalImageIndex"
          Write-Output "Actual edition label: $actualEdition"

          Add-Content -Path $env:GITHUB_ENV -Value "EDITION_NAME=$edition"
          Add-Content -Path $env:GITHUB_ENV -Value "SOURCE_IMAGE_INDEX=$sourceImageIndex"
          Add-Content -Path $env:GITHUB_ENV -Value "SOURCE_IMAGE_NAME=$sourceImageName"
          Add-Content -Path $env:GITHUB_ENV -Value "FINAL_IMAGE_INDEX=$finalImageIndex"

          if ([string]::IsNullOrWhiteSpace($buildNumber)) {
            $buildNumber = "$env:WINDOWS_BUILD_FALLBACK"
            if (-not [string]::IsNullOrWhiteSpace($buildNumber)) {
              Write-Output "Build number from workflow fallback input: $buildNumber"
            }
          }

          if ([string]::IsNullOrWhiteSpace($buildNumber)) {
            Write-Error "Unable to determine Windows build number: ISO metadata extraction failed and no windows_build fallback input was provided. Refusing to publish an ISO without a verifiable build number."
            exit 1
          }
          if ($buildNumber -notmatch '^(?:\d{5}(?:\.\d+)?|Latest|Unknown)$') {
            throw "Windows build metadata contains an unsafe or unsupported build label."
          }

          $version = "$env:WINDOWS_VERSION"
          $language = "$env:BUILD_LANGUAGE"
          $date = "$env:BUILD_DATE"

          $isoName = "Tiny11-$version-$buildNumber-$language-$edition-$date.iso"

          # Build-number-first tag, suffixed to avoid collisions across editions
          $baseTag = "$buildNumber-std-$($edition.ToLower())"

          Write-Output "Generated ISO name: $isoName"
          Write-Output "Generated release tag: $baseTag"

          Add-Content -Path $env:GITHUB_ENV -Value "ISO_FILENAME=$isoName"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_TAG=$baseTag"
          Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_BUILD_NUMBER=$buildNumber"

          # Rename to proper filename
          Move-Item -Path $tempIso -Destination $isoName -Force
          Write-Output "ISO renamed to: $isoName"

          $sizeGB = [math]::Round((Get-Item $isoName).Length / 1GB, 2)
          Write-Output "$isoName created successfully: ${sizeGB}GB"

          # Generate checksums
          Write-Output "Generating checksums..."
          $sha256 = (Get-FileHash -Path $isoName -Algorithm SHA256).Hash
          $md5 = (Get-FileHash -Path $isoName -Algorithm MD5).Hash

          # Save checksums to files
          "$sha256  $isoName" | Out-File -FilePath "$isoName.sha256" -Encoding ASCII
          "$md5  $isoName" | Out-File -FilePath "$isoName.md5" -Encoding ASCII

          # Create verification file with all info
          $verificationInfo = @"
          Tiny11 ISO Verification
          ========================
          File: $isoName
          Windows Build: $buildNumber
          Size: ${sizeGB}GB
          Build Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')
          Source Image Index: $sourceImageIndex
          Source Image Name: $sourceImageName
          Final install.wim image index: $finalImageIndex
          Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          SHA256: $sha256
          MD5: $md5

          To verify:
            certutil -hashfile $isoName SHA256
            certutil -hashfile $isoName MD5
          "@

          $verificationInfo | Out-File -FilePath "$isoName.txt" -Encoding UTF8

          # Persist values for later steps
          Add-Content -Path $env:GITHUB_ENV -Value "ISO_NAME=$isoName"
          Add-Content -Path $env:GITHUB_ENV -Value "ISO_SIZE_GB=$sizeGB"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "iso_name=$isoName"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "release_tag=$baseTag"
          Add-Content -Path $env:GITHUB_ENV -Value "ISO_SHA256=$sha256"
          Add-Content -Path $env:GITHUB_ENV -Value "ISO_MD5=$md5"
          
      - name: Discord - Build Completed
        if: success()
        continue-on-error: true
        run: |
          $isoSize = if ($env:ISO_SIZE_GB) {
            "$env:ISO_SIZE_GB GB"
          } else {
            $isoPath = Get-ChildItem -Path . -Filter "*.iso" -Recurse | Select-Object -First 1
            if ($isoPath) { "{0:N2} GB" -f ($isoPath.Length / 1GB) } else { "Unknown" }
          }

          # Compute real elapsed wall-clock duration from the recorded start time
          $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long]$env:BUILD_START_UNIX
          $duration = "{0}m {1}s" -f [math]::Floor($elapsed / 60), ($elapsed % 60)

          python scripts/discord_notify.py `
            --webhook "$env:DISCORD_WEBHOOK" `
            --type build-completed `
            --data (ConvertTo-Json @{
              version = "$env:WINDOWS_VERSION"
              build_type = "Standard"
              edition = "$env:EDITION_NAME"
              duration = $duration
              iso_size = $isoSize
              distribution = "Temporary GitHub Actions artifact (7-day retention); no permanent host configured"
              account_setup = "$env:ACCOUNT_SETUP"
              windows_build = "$env:WINDOWS_BUILD_NUMBER"
            } -Compress)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_BUILDS }}
        shell: pwsh

      - name: Cleanup before upload
        shell: pwsh
        run: |
          Write-Output "Cleaning up to free disk space..."
          
          # Unmount ISO
          $isoPath = Join-Path $PWD "Win11_Source.iso"
          if (Test-Path $isoPath) {
            Get-DiskImage -ImagePath $isoPath | Dismount-DiskImage -ErrorAction SilentlyContinue
            Write-Output "ISO unmounted"
          }
          
          # Remove source ISO
          Remove-Item "Win11_Source.iso" -Force -ErrorAction SilentlyContinue
          
          # Remove build logs if they're large
          Get-ChildItem -Path . -Filter "*.log" | Where-Object { $_.Length -gt 10MB } | Remove-Item -Force
          
          $disk = Get-PSDrive C
          $freeGB = [math]::Round($disk.Free / 1GB, 2)
          Write-Output "Available space after cleanup: ${freeGB}GB"

      - name: Upload ISO as a temporary test artifact (7-day retention)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build_metadata.outputs.iso_name }}
          path: |
            ${{ steps.build_metadata.outputs.iso_name }}
            ${{ steps.build_metadata.outputs.iso_name }}.sha256
            ${{ steps.build_metadata.outputs.iso_name }}.md5
            ${{ steps.build_metadata.outputs.iso_name }}.txt
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Workflow summary
        shell: pwsh
        run: |
          $summary = @"
          # ✅ Tiny11 Build Completed Successfully

          ## 📦 Build Information
          - **ISO:** $env:ISO_NAME
          - **Size:** $env:ISO_SIZE_GB GB
          - **Build label:** ${{ steps.build_metadata.outputs.release_tag }} (filename metadata; no public release is created)
          - **Version:** $env:WINDOWS_VERSION
          - **Source:** $(if ($env:ISO_SOURCE_MODE -eq 'custom') { 'Custom direct ISO (URL withheld)' } else { 'Microsoft resolver' })
          - **Language:** $env:BUILD_LANGUAGE_INPUT
          - **Selected source image:** $env:SOURCE_IMAGE_NAME (index $env:SOURCE_IMAGE_INDEX)
          - **Final install.wim index:** $env:FINAL_IMAGE_INDEX

          ## 📥 Download
          Temporary GitHub Actions artifact is available in this workflow run for 7 days. This is test distribution, not permanent hosting.

          ## 🔒 Checksums
          **SHA256:**

          ```
          $env:ISO_SHA256
          ```

          **MD5:**

          ```
          $env:ISO_MD5
          ```

          ## ⏱️ Build Time
          Completed at: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')

          ---
          Maintained by [NggKhaiz](https://github.com/NggKhaiz/TINY11-AUTOMATION) | Automation by [kelexine](https://github.com/kelexine) | Original builder by [ntdevlabs](https://github.com/ntdevlabs)
          "@

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary

      - name: Capture build error for Discord
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: |
          $logFile = Get-ChildItem -Path scripts -Filter "tiny11_*.log" -ErrorAction SilentlyContinue |
                     Sort-Object LastWriteTime -Descending |
                     Select-Object -First 1
          if ($logFile) {
            $errorLines = Select-String -Path $logFile.FullName -Pattern '\[ERROR\]' |
                          Select-Object -Last 10 |
                          ForEach-Object { $_.Line }
            $errorSummary = if ($errorLines) {
              $errorLines -join "`n"
            } else {
              (Get-Content $logFile.FullName -Tail 5) -join "`n"
            }
            do {
              $delimiter = "TINY11_ERROR_$([guid]::NewGuid().ToString('N'))"
            } while ($errorSummary.Contains($delimiter))
            Add-Content -Path $env:GITHUB_ENV -Value "BUILD_ERROR_SUMMARY<<$delimiter"
            Add-Content -Path $env:GITHUB_ENV -Value $errorSummary
            Add-Content -Path $env:GITHUB_ENV -Value $delimiter
          } else {
            Add-Content -Path $env:GITHUB_ENV -Value "BUILD_ERROR_SUMMARY=No builder log found — check step outputs above."
          }

      - name: Upload build log on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: tiny11-build-log-${{ github.run_id }}
          path: scripts/tiny11_*.log
          retention-days: 7
          if-no-files-found: warn

      - name: Discord - Build Failed
        if: failure()
        continue-on-error: true
        run: |
          $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long]$env:BUILD_START_UNIX
          $duration = "{0}m {1}s" -f [math]::Floor($elapsed / 60), ($elapsed % 60)

          python scripts/discord_notify.py `
            --webhook "$env:DISCORD_WEBHOOK" `
            --type build-failed `
            --data (ConvertTo-Json @{
              version = "$env:WINDOWS_VERSION"
              build_type = "Standard"
              edition = "$env:EDITION_NAME"
              duration = $duration
              error = $env:BUILD_ERROR_SUMMARY
              logs_url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              windows_build = "$env:WINDOWS_BUILD_NUMBER"
            } -Compress)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_ERRORS }}
        shell: pwsh
