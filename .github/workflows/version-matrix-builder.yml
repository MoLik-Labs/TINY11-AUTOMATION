# .github/workflows/version-matrix-builder.yml
# Windows release detection. Build dispatch is manual by default.
# Maintainer: NggKhaiz | automation credit: kelexine | original builder: ntdevlabs

name: Version Matrix Builder

on:
  schedule:
    # Run weekly at 00:00 UTC on Sundays to check for new releases
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      force_check:
        description: 'Force check even if no new version detected'
        required: false
        type: boolean
        default: false
      skip_build:
        description: 'Skip build trigger (recommended: detection only)'
        required: false
        type: boolean
        default: true

# Default to read-only; individual jobs request additional permissions as needed.
permissions:
  contents: read

env:
  RELEASE_TRACKING_FILE: 'tracked_releases.json'

jobs:
  detect-releases:
    name: Detect New Windows Releases
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Persist stable release tracking data
      issues: write    # Create release-review issues
    outputs:
      new_releases: ${{ steps.check.outputs.new_releases }}
      releases_matrix: ${{ steps.check.outputs.releases_matrix }}
      has_new: ${{ steps.check.outputs.has_new }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Scripts Directory
        run: |
          # Ensure scripts directory exists
          mkdir -p scripts

          # If release_detector.py doesn't exist in scripts, check root
          if [ ! -f "scripts/release_detector.py" ] && [ -f "release_detector.py" ]; then
            echo "📦 Moving release_detector.py to scripts/"
            mv release_detector.py scripts/
          fi

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-common.txt
            requirements-playwright.txt
            requirements-dev.txt

      - name: Install Dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Python Unit Tests
        run: |
          python3 -m pytest -q tests

      - name: Install Playwright Browsers
        run: playwright install --with-deps chromium

      - name: Fetch Current Tracked Releases
        id: fetch_tracked
        run: |
          # GitHub Actions output doesn't handle large multi-line JSON well
          # We'll just check if file exists for now
          if [ -f "${{ env.RELEASE_TRACKING_FILE }}" ]; then
            echo "has_tracking=true" >> "$GITHUB_OUTPUT"
            echo "📋 Found existing tracking file"
          else
            echo "has_tracking=false" >> "$GITHUB_OUTPUT"
            echo "📋 No existing tracking file"
          fi

      - name: Check for New Releases
        id: check
        env:
          FORCE_CHECK: ${{ github.event.inputs.force_check || 'false' }}
        run: |
          echo "=================================="
          echo "🔍 Windows Release Detection"
          echo "=================================="
          echo "Force check: $FORCE_CHECK"
          echo "Tracking file: ${{ env.RELEASE_TRACKING_FILE }}"
          echo ""

          # Build command with conditional --force flag
          if [ "$FORCE_CHECK" = "true" ]; then
            echo "🔄 Running with --force flag (will re-check recently detected builds)"
            python3 scripts/release_detector.py \
              --force \
              --output=detector_output.txt \
              --tracking-file=${{ env.RELEASE_TRACKING_FILE }}
          else
            echo "📅 Running normal check (skips if checked within last hour)"
            python3 scripts/release_detector.py \
              --output=detector_output.txt \
              --tracking-file=${{ env.RELEASE_TRACKING_FILE }}
          fi

          DETECTOR_EXIT=$?
          echo ""
          echo "Detector exit code: $DETECTOR_EXIT"

          if [ $DETECTOR_EXIT -ne 0 ]; then
            echo "❌ Detector script failed!"
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Read outputs from file and set GitHub Actions outputs
          if [ -f "detector_output.txt" ]; then
            echo ""
            echo "📄 Reading detector outputs..."
            echo "=================================="

            # Read each line and set as output
            while IFS='=' read -r key value; do
              # Skip empty lines and comments
              if [ -n "$key" ] && [[ ! "$key" =~ ^# ]]; then
                echo "$key=$value" >> "$GITHUB_OUTPUT"

                # Show appropriate output based on size
                if [ ${#value} -gt 200 ]; then
                  echo "✓ Set output: $key (${#value} chars - JSON data)"
                elif [ ${#value} -gt 50 ]; then
                  echo "✓ Set output: $key=${value:0:50}... (${#value} chars)"
                else
                  echo "✓ Set output: $key=$value"
                fi
              fi
            done < detector_output.txt

            echo "=================================="
            echo "✅ Outputs set successfully"
          else
            echo "❌ Detector output file not found!"
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Commit Updated Tracking File
        if: steps.check.outputs.has_new == 'true'
        id: commit_tracking
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ${{ env.RELEASE_TRACKING_FILE }}

          if git commit -m "🤖 Update tracked releases - $(date -u +'%Y-%m-%d %H:%M UTC')"; then
            echo "commit_made=true" >> "$GITHUB_OUTPUT"
            if git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
              echo "push_success=true" >> "$GITHUB_OUTPUT"
              echo "✅ Tracking file committed and pushed successfully"
            else
              echo "push_success=false" >> "$GITHUB_OUTPUT"
              echo "⚠️ Push failed - may need manual sync"
            fi
          else
            echo "commit_made=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ No changes to commit"
          fi

      - name: Send Discord Notification - New Releases
        if: steps.check.outputs.has_new == 'true'
        continue-on-error: true
        env:
          RELEASES_JSON: ${{ steps.check.outputs.new_releases }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_RELEASES }}
        run: |
          echo "📢 Sending release summary (signed download URL omitted from the message)..."
          python3 scripts/discord_notify.py \
            --webhook "$DISCORD_WEBHOOK" \
            --type new-releases \
            --data "$RELEASES_JSON" || echo "Discord notification failed (continuing)"

      - name: Create GitHub Issue for New Release
        if: steps.check.outputs.has_new == 'true'
        id: create_issues
        uses: actions/github-script@v9
        continue-on-error: true
        env:
          NEW_RELEASES_JSON: ${{ steps.check.outputs.new_releases }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Parse the JSON from an environment variable instead of embedding it in script source
            const releasesJson = process.env.NEW_RELEASES_JSON || '[]';
            let newReleases;
            try {
              newReleases = JSON.parse(releasesJson);
            } catch (e) {
              console.error('Failed to parse releases JSON:', e.message);
              newReleases = [];
            }

            console.log(`📝 Creating ${newReleases.length} issue(s)...`);

            let created = 0;
            let failed = 0;

            for (const release of newReleases) {
              const issueBody = `## 🎉 New Windows Release Detected

            **Build Information:**
            - **Title:** ${release.title}
            - **Build Number:** ${release.build_number}
            - **Version:** ${release.version}
            - **Architecture:** ${release.architecture}
            - **Detection Date:** ${release.detected_date}

            **ISO Source:**
            - [Microsoft Windows 11 download page](https://www.microsoft.com/software-download/windows11)
            - Signed download links expire and are intentionally omitted from public issues.

            **Review and testing:**
            - [ ] Review whether a Standard/SafeLite build is needed for Home or Pro
            - [ ] Review whether a Core VM/Lab build is needed for Home or Pro
            - [ ] Nano is disabled from automatic dispatch and remains manual VM/Lab testing only
            - [ ] Test any output in a disposable VM
            - [ ] Review functionality and performance measurements before recommending an image

            **Build matrix:** Standard/Core × Home/Pro. Detection does not dispatch by default; manual dispatch defaults to skip builds, and scheduled dispatch requires explicit opt-in.

            ---
            *Created by TINY11-AUTOMATION; maintained by NggKhaiz, with automation credit to kelexine and original-builder credit to ntdevlabs.*
            `.trim();

              try {
                const issue = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `🆕 New Windows ${release.version} Release - Build ${release.build_number}`,
                  body: issueBody,
                  labels: ['automated', 'new-release', 'build-pending']
                });

                console.log(`✅ Created issue #${issue.data.number}: ${release.title}`);
                created++;
              } catch (error) {
                console.error(`❌ Failed to create issue for ${release.title}: ${error.message}`);
                failed++;
              }
            }

            console.log(`✅ Issue creation completed: ${created} created, ${failed} failed`);

      - name: Summary of Issue Creation
        if: steps.check.outputs.has_new == 'true'
        run: |
          echo "📊 Issue Creation Summary:"
          echo "  Step outcome: ${{ steps.create_issues.outcome }}"
          if [ "${{ steps.create_issues.outcome }}" = "success" ]; then
            echo "  ✅ All issues created successfully"
          else
            echo "  ⚠️  Some issues may have failed (check logs above)"
            echo "  ℹ️  This won't prevent builds from triggering"
          fi

  trigger-builds:
    name: Trigger Automated Builds
    needs: detect-releases
    permissions:
      actions: write  # Dispatch only the explicitly approved build workflows
    if: >-
      needs.detect-releases.outputs.has_new == 'true' && (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_build == 'false') ||
        (github.event_name == 'schedule' && vars.TINY11_AUTO_BUILD_ENABLED == 'true')
      )
    runs-on: ubuntu-latest
    strategy:
      matrix:
        release: ${{ fromJson(needs.detect-releases.outputs.releases_matrix) }}
        build_type: ['standard', 'core']  # SafeLite physical profile + VM/LabCore
        edition: ['Home', 'Pro']

    steps:
      - name: Trigger Build Workflow
        uses: actions/github-script@v9
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
          EDITION: ${{ matrix.edition }}
          RELEASE_JSON: ${{ toJson(matrix.release) }}
        with:
          script: |
            const workflowMap = {
              'standard': 'build-tiny11.yml',
              'core': 'build-tiny11-core.yml'
            };
            const workflow = workflowMap[process.env.BUILD_TYPE];
            const release = JSON.parse(process.env.RELEASE_JSON);
            const edition = process.env.EDITION;
            const defaultBranch = context.payload.repository.default_branch || 'main';

            if (
              typeof release.iso_path !== 'string' ||
              !release.iso_path.startsWith('/') ||
              !release.iso_path.toLowerCase().endsWith('.iso') ||
              /[?#\r\n]/.test(release.iso_path)
            ) {
              throw new Error('Release matrix is missing a valid query-free Microsoft ISO path.');
            }

            console.log(`Triggering ${workflow} for ${release.version} (${edition})`);

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflow,
              ref: defaultBranch,
              inputs: {
                expected_iso_path: release.iso_path,
                image_index: '0',
                image_edition: edition,
                skip_cleanup: 'false',
                windows_version: release.version,
                windows_build: /^(?:\d{5}(?:\.\d+)?)$/.test(release.build_number || '') ? release.build_number : '',
                language: 'English'
              }
            });

            console.log(`✅ Build triggered successfully!`);

  notify-completion:
    name: Send Build-Dispatch Notification
    needs: [detect-releases, trigger-builds]
    permissions:
      contents: read
    if: needs.detect-releases.outputs.has_new == 'true' && needs.trigger-builds.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/
            requirements-common.txt
          sparse-checkout-cone-mode: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install pinned runtime dependencies
        run: python -m pip install -r requirements-common.txt

      - name: Send Discord Notification
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_RELEASES }}
          BUILDS_RESULT: ${{ needs.trigger-builds.result }}
          NEW_RELEASES: ${{ needs.detect-releases.outputs.new_releases }}
        run: |
          echo "📢 Version Matrix Builder completed!"
          echo "New releases detected: ${{ needs.detect-releases.outputs.has_new }}"
          echo "Builds triggered: $BUILDS_RESULT"

          # Standard + Core for Home + Pro: four dispatches per detected release.
          RELEASES_COUNT=$(printf '%s' "$NEW_RELEASES" | python3 -c "import sys, json; print(len(json.load(sys.stdin)))")
          BUILDS_COUNT=$((RELEASES_COUNT * 4))

          if [ -n "$DISCORD_WEBHOOK" ]; then
            python3 scripts/discord_notify.py \
              --webhook "$DISCORD_WEBHOOK" \
              --type builds-triggered \
              --data "{\"builds_count\":$BUILDS_COUNT,\"releases\":$NEW_RELEASES}" || echo "Discord notification failed"
          else
            echo "⚠️ DISCORD_WEBHOOK_RELEASES not configured, skipping notification"
          fi
